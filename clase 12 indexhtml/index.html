<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café El Buen Grano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contenedor-principal">

        <header>

        
            <div class="logo">
                <img src="logonuevo.png" alt="Logo Café El Buen Grano">
            </div>

            
            <nav>
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Menú</a></li>
                    <li><a href="#">Ubicación</a></li>
                </ul>
            </nav>

        </header>

        <main>
            <section class="info-producto">

                <div class="imagen-cafe">
                    <img
                        src="https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=800"
                        alt="Caramel Macchiato">
                </div>

                <div class="texto-cafe">
                    <h2>Caramel Macchiato de Temporada</h2>

                    <p>
                        Disfruta nuestro delicioso Caramel Macchiato preparado con
                        espresso premium, leche cremosa y una irresistible capa de
                        caramelo. Perfecto para acompañar tus mañanas o tardes.
                    </p>

                    <button type="button">Hacer Pedido</button>
                </div>

            </section>
        </main>

        <footer>
            <p>&copy; 2026 Café El Buen Grano. Todos los derechos reservados.</p>
        </footer>

    </div>

</body>
</html>
